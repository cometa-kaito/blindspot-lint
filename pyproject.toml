[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blindspot-lint"
version = "0.1.0"
description = "ローカルLLMが見落とす欠陥を補う Python 向け静的検査器"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Kaito Okumura" }]
keywords = ["lint", "static-analysis", "llm", "code-review", "education"]
dependencies = []          # 標準ライブラリのみ。依存を増やさない方針

classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Intended Audience :: Education",
  "Intended Audience :: Developers",
  "Natural Language :: Japanese",
]

[project.urls]
Homepage = "https://github.com/cometa-kaito/blindspot-lint"
Issues = "https://github.com/cometa-kaito/blindspot-lint/issues"

[project.scripts]
blindspot = "blindspot:cli"
blindspot-loop = "blindspot_loop:cli"

[tool.hatch.build.targets.wheel]
# 検査器は単一ファイルのまま。コピーしてきて python3 blindspot.py でも動く状態を保つ。
# 差し戻しループはその上に乗る別ファイルで、画面の HTML を1枚だけ連れていく。
only-include = ["blindspot.py", "blindspot_loop.py"]

[tool.hatch.build.targets.wheel.force-include]
# site-packages に web/ という一般名の階層を作らないため、名前を変えて入れる
"web/loop.html" = "blindspot_assets/loop.html"

[tool.hatch.build.targets.sdist]
include = ["blindspot.py", "blindspot_loop.py", "test_blindspot.py",
           "test_blindspot_loop.py", "web/", "README.md", "LICENSE"]
